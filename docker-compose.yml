services:
  web:
    build:
      context: .
      dockerfile: src/Tectonic.Web/Dockerfile
    image: tectonic-web
    container_name: tectonic-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      API_BASE_URL: ${API_BASE_URL}
      API_USE_MOCK: ${API_USE_MOCK:-false}
