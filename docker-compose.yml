services:
  web:
    build: .
    image: tectonic-web
    container_name: tectonic-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      # ASP.NET Core maps Api__BaseUrl to the Api:BaseUrl setting.
      Api__BaseUrl: ${API_BASE_URL}
      Api__UseMock: ${API_USE_MOCK:-false}
